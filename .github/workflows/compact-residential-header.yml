name: Compact Residential Header

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compact-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten Residential header spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/projects/residential.astro')
          text = path.read_text()
          old = '.hero{padding:58px clamp(24px,7vw,100px) 46px;background:var(--paper);border-bottom:1px solid var(--line)}'
          new = '.hero{padding:35px clamp(24px,7vw,100px) 30px;background:var(--paper);border-bottom:1px solid var(--line)}'
          old_mobile = '@media(max-width:600px){.hero{padding:48px 20px 40px}'
          new_mobile = '@media(max-width:600px){.hero{padding:32px 20px 28px}'
          if old not in text or old_mobile not in text:
              raise SystemExit('Expected Residential header CSS was not found; no changes made.')
          text = text.replace(old, new, 1).replace(old_mobile, new_mobile, 1)
          path.write_text(text)
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/projects/residential.astro .github/workflows/compact-residential-header.yml
          git rm .github/workflows/compact-residential-header.yml
          git commit -m "Tighten residential page header spacing"
          git push origin main
